plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lokesh.spectrum'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lokesh.spectrum'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // Fixed key so every new build installs over the previous one (and keeps settings).
    signingConfigs {
        debug {
            storeFile file('spectrum.jks')
            storePassword 'spectrum-analyser'
            keyAlias 'spectrum'
            keyPassword 'spectrum-analyser'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
